name: Build DeliveryLog v2.0.5 Test APK
on:
  push:
    branches: [deliverylog-v2.0.5-build]
    paths:
      - 'deliverylog-android/**'
      - '.github/workflows/build-deliverylog-v205.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "No sdkmanager found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack original design and Android wrapper
        run: |
          mkdir -p deliverylog-classic/app/src/main/assets
          base64 -d deliverylog-android/classic-native.b64 | xz -d | tar -xf - -C deliverylog-classic
          base64 -d deliverylog-android/original-design.b64 | xz -d | tar -xf - -C deliverylog-classic/app/src/main/assets
          rm -f deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/GpsListener.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("deliverylog-classic/app/src/main/assets/app.js")
          s = p.read_text(encoding="utf-8")
          before = """    if (state.activePickup) {
      drawRoute(state.activePickup.routePoints,'#ff9b3c',6);
      const p=toScreen(state.activePickup.location);
      ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fillStyle='#7959db';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('P',p.x,p.y);
    }"""
          after = """    if (state.activePickup) {
      drawRoute(state.activePickup.routePoints,'#ff9b3c',6);
      if (state.activePickup.location) {
        const p=toScreen(state.activePickup.location);
        ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fillStyle='#7959db';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('P',p.x,p.y);
      }
    }"""
          assert s.count(before) == 1, "Expected to patch pickup GPS null handling"
          p.write_text(s.replace(before,after),encoding="utf-8")
          PY
                    test -f deliverylog-classic/app/src/main/assets/index.html
          test -f deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java
      - name: Build original-design APK
        working-directory: deliverylog-classic
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryLog-v2.0.5-Classic-Design-APK
          path: deliverylog-classic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
