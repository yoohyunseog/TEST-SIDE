name: Build DeliveryLog v2.0.10 Live Preview and Copy
on:
  push:
    branches: [deliverylog-v2.0.5-build]
    paths:
      - 'deliverylog-android/**'
      - '.github/workflows/build-deliverylog-v205.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original app and patch risk buttons
        run: |
          mkdir -p deliverylog-classic/app/src/main/assets
          base64 -d deliverylog-android/classic-native.b64 | xz -d | tar -xf - -C deliverylog-classic
          base64 -d deliverylog-android/original-design.b64 | xz -d | tar -xf - -C deliverylog-classic/app/src/main/assets
          base64 -d deliverylog-android/risk-v206.b64 | xz -d | tar -xf - -C deliverylog-classic/app/src/main/assets
          rm -f deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/GpsListener.java
          sed -i 's/com.chamsosik.deliverylog.classic/com.chamsosik.deliverylog.riskdemo/' deliverylog-classic/app/build.gradle
          sed -i "s/versionCode 26/versionCode 27/;s/2.0.5-classic/2.0.6-risk/" deliverylog-classic/app/build.gradle
          sed -i 's/배달로그 클래식/배달로그 위험기록/' deliverylog-classic/app/src/main/AndroidManifest.xml
          test -f deliverylog-classic/app/src/main/assets/index.html
          grep -q 'data-risk-kind="행인"' deliverylog-classic/app/src/main/assets/index.html
          test -f deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java
      - name: Apply v2.0.9 GPS and clipboard patch
        run: |
          base64 -d deliverylog-android/v209-upgrade.patch.xz.b64 | xz -d > /tmp/route-copy-v209.patch
          python3 -c 'from pathlib import Path; s=Path("/tmp/route-copy-v209.patch").read_text(); Path("/tmp/route-copy-assets.patch").write_text(s.split("--- a/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java")[0])'
          (cd deliverylog-classic && patch -p1 --batch --fuzz=0 < /tmp/route-copy-assets.patch)
          cp deliverylog-android/v209-MainActivity.java deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java
          cp deliverylog-android/v209-TrackerService.java deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/TrackerService.java
          sed -i 's/deliverylog.riskdemo/deliverylog.copydemo/;s/versionCode 27/versionCode 29/;s/2.0.6-risk/2.0.9-copy/' deliverylog-classic/app/build.gradle
          sed -i 's/배달로그 위험기록/배달로그 동선복사/' deliverylog-classic/app/src/main/AndroidManifest.xml
          grep -q 'copyTodayRouteBtn' deliverylog-classic/app/src/main/assets/index.html
          grep -q 'copyRouteData' deliverylog-classic/app/src/main/assets/app.js
          grep -q 'DeliveryClipboard' deliverylog-classic/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java
          node --check deliverylog-classic/app/src/main/assets/app.js
          node --check deliverylog-classic/app/src/main/assets/route-copy.js
      - name: Fix route incident preview and Settings copy button
        run: |
          base64 -d deliverylog-android/v210-settings-preview-fix.b64 | xz -d | tar -xf - -C deliverylog-classic
          sed -i 's/deliverylog.copydemo/deliverylog.copyfixdemo/;s/versionCode 29/versionCode 30/;s/2.0.9-copy/2.0.10-preview-copy/' deliverylog-classic/app/build.gradle
          sed -i 's/배달로그 동선복사/배달로그 미리보기 복사/' deliverylog-classic/app/src/main/AndroidManifest.xml
          grep -q 'routeCopyClipboardBtn' deliverylog-classic/app/src/main/assets/index.html
          grep -q 'refreshRouteCopyPreview' deliverylog-classic/app/src/main/assets/app.js
          node --check deliverylog-classic/app/src/main/assets/app.js
      - name: Build debug APK
        working-directory: deliverylog-classic
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm built assets
        run: |
          unzip -l deliverylog-classic/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/app.js'
          unzip -l deliverylog-classic/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/index.html'
          unzip -l deliverylog-classic/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/route-copy.js'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryLog-v2.0.10-Preview-Copy-Fix-APK
          path: deliverylog-classic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
