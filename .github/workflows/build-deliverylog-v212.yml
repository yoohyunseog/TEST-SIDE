name: Build DeliveryLog v2.0.12 Floating Risk UI
on:
  push:
    branches: [deliverylog-v2.0.12-floating-ui]
    paths:
      - 'deliverylog-android/v212-full-source.tar.xz.b64'
      - '.github/workflows/build-deliverylog-v212.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore complete source
        run: |
          mkdir -p deliverylog-v212
          base64 -d deliverylog-android/v212-full-source.tar.xz.b64 | xz -d | tar -xf - -C deliverylog-v212
          test -f deliverylog-v212/app/src/main/java/com/chamsosik/deliverylog/RiskOverlay.java
          test -f deliverylog-v212/app/src/main/java/com/chamsosik/deliverylog/RiskQueue.java
          grep -q 'riskFloatSize' deliverylog-v212/app/src/main/assets/index.html
          grep -q 'risk-overlay-preview' deliverylog-v212/app/src/main/java/com/chamsosik/deliverylog/MainActivity.java
          grep -q 'autoCollapse' deliverylog-v212/app/src/main/java/com/chamsosik/deliverylog/RiskOverlay.java
          grep -q 'com.chamsosik.deliverylog.floatingdemo' deliverylog-v212/app/build.gradle
          node --check deliverylog-v212/app/src/main/assets/app.js
      - name: Build APK
        working-directory: deliverylog-v212
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK assets and archive
        run: |
          FILE="deliverylog-v212/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$FILE"
          unzip -t "$FILE" | tail -n 1
          unzip -l "$FILE" | grep 'assets/index.html'
          unzip -p "$FILE" assets/index.html | grep -q 'riskFloatPreview'
          unzip -l "$FILE" | grep 'classes.dex'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryLog-v2.0.12-Floating-UI-APK
          path: deliverylog-v212/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
